services:
  synalum-ai-mentor:
    build: .
    container_name: synalum-ai-mentor
    ports:
      - "3000:3000"
    # GEMINI_API_KEY dkk. dibaca dari .env di direktori yang sama.
    # Tanpa key, container jalan MODE DEMO (balasan contoh).
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
